<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annual Loan Count Distribution of LOs</title><style>:root{--bg:#fbf5e7;--art:#f7ebd3;--m:#86c875;--v:#9a72d1;--e:#3C5EE2;--ma:#E8B62C;--j:#E38C4A;--s:#7B284C;--n:#003c88;--l:#e3d8c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#1d2b43}.app{max-width:1500px;min-height:100vh;margin:auto;padding:clamp(24px,4vw,64px);display:grid;grid-template-columns:minmax(330px,.92fr) minmax(570px,1.08fr);gap:clamp(30px,5vw,76px);align-items:center}.art{width:min(100%,650px);aspect-ratio:1;background:var(--art);padding:4.75%;border:1px solid #e5d5ba}.orbit{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden}.ring{position:absolute;border-radius:50%}.saturn{inset:0;background:var(--s)}.jupiter{inset:6.25%;background:var(--j)}.mars{inset:12.5%;background:var(--ma)}.earth{inset:18.75%;background:var(--e)}.venus{inset:25%;background:var(--v)}.mercury{inset:31.25%;background:var(--m)}.core{position:absolute;inset:37.5%;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--n);font:800 clamp(14px,1.75vw,23px) Georgia,serif;letter-spacing:-.055em}.panel{min-width:0;background:#fffdf8;border:1px solid var(--l);border-radius:18px;padding:clamp(22px,3vw,38px)}h1{margin:0 0 28px;font-size:clamp(26px,2.75vw,40px);letter-spacing:-.04em}.wrap{overflow:hidden;border:1px solid var(--l);border-radius:12px}table{width:100%;table-layout:fixed;border-collapse:collapse}col:first-child{width:31%}col:nth-child(2){width:18%}col:nth-child(3){width:20%}col:last-child{width:31%}th,td{padding:15px 12px;border-bottom:1px solid var(--l);font-size:14px;overflow-wrap:anywhere}th{background:#f4ead5;color:#5f6671;font-size:10px;text-transform:uppercase;letter-spacing:.065em;line-height:1.22}tr:last-child td{border:0}.num{text-align:right;white-space:nowrap}.name{font-weight:bold}.d{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px}.dm{background:var(--m)}.dv{background:var(--v)}.de{background:var(--e)}.dma{background:var(--ma)}.dj{background:var(--j)}.ds{background:var(--s)}@media(max-width:870px){.app{grid-template-columns:1fr;padding:28px 20px}.art{margin:auto}}@media(max-width:500px){.app{padding:20px 12px}.panel{padding:20px 10px}th,td{padding:12px 6px}th{font-size:8px}td{font-size:12px}}</style></head><body><main class="app"><section class="art"><div class="orbit"><div class="ring saturn"></div><div class="ring jupiter"></div><div class="ring mars"></div><div class="ring earth"></div><div class="ring venus"></div><div class="ring mercury"></div><div class="core">UWM</div></div></section><section class="panel"><h1>Annual Loan Count Distribution of LOs</h1><div class="wrap"><table><colgroup><col><col><col><col></colgroup><thead><tr><th>Band</th><th class="num">% of LOs</th><th class="num">% of Loans</th><th class="num">Cumulative % of Loan</th></tr></thead><tbody><tr><td class="name"><i class="d dm"></i>Mercury</td><td class="num">10%</td><td class="num">50%</td><td class="num">50%</td></tr><tr><td class="name"><i class="d dv"></i>Venus</td><td class="num">10%</td><td class="num">20%</td><td class="num">70%</td></tr><tr><td class="name"><i class="d de"></i>Earth</td><td class="num">10%</td><td class="num">10%</td><td class="num">80%</td></tr><tr><td class="name"><i class="d dma"></i>Mars</td><td class="num">20%</td><td class="num">10%</td><td class="num">90%</td></tr><tr><td class="name"><i class="d dj"></i>Jupiter</td><td class="num">20%</td><td class="num">5%</td><td class="num">95%</td></tr><tr><td class="name"><i class="d ds"></i>Saturn</td><td class="num">30%</td><td class="num">5%</td><td class="num">100%</td></tr></tbody></table></div></section></main></body></html>
