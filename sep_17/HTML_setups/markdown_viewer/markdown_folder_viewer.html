<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Folder Viewer</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --line: #dfe4ec;
        --text: #1f2736;
        --muted: #667389;
        --faint: #8c97aa;
        --accent: #c43dff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Lato", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      .mobile-bar {
        display: none;
      }

      .shell {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr) 210px;
        background: var(--surface);
      }

      .sidebar,
      .toc {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        overflow: auto;
        background: var(--surface);
      }

      .sidebar {
        padding: 30px 14px 28px 36px;
        border-right: 1px solid var(--line);
      }

      .toc {
        padding: 30px 36px 28px 14px;
        border-left: 1px solid var(--line);
      }

      .brand {
        margin-bottom: 28px;
      }

      .brand-title {
        display: flex;
        flex-direction: column;
        gap: 1px;
        line-height: 0.92;
      }

      .brand-word {
        display: block;
        font-size: 1.58rem;
        font-weight: 700;
        letter-spacing: -0.05em;
        text-transform: capitalize;
      }

      .brand-word.accent {
        color: var(--accent);
        font-style: italic;
      }

      .section-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .section-link {
        display: block;
        padding: 4px 0;
        color: var(--muted);
        line-height: 1.2;
        cursor: pointer;
      }

      .section-link.active {
        color: var(--accent);
      }

      .main {
        padding: 28px 56px 56px;
        min-width: 0;
      }

      .article {
        max-width: none;
      }

      .eyebrow {
        margin-bottom: 12px;
        color: var(--faint);
        font-size: 0.9rem;
      }

      .article h1 {
        margin: 0;
        font-size: clamp(1.75rem, 2.8vw, 2.4rem);
        line-height: 1.08;
        font-weight: 700;
      }

      .figure {
        margin: 22px 0 8px;
        border: 1px solid var(--line);
        background: #fff;
        overflow: hidden;
      }

      .figure img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }

      .figure.hidden,
      .content-block.hidden,
      .article-body.hidden,
      .commentary-list.hidden,
      .markdown-content.hidden {
        display: none;
      }

      .commentary-list {
        margin: 18px 0 0;
        padding: 0 0 0 1.15em;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.76;
      }

      .commentary-list li + li {
        margin-top: 10px;
      }

      .markdown-content {
        margin-top: 18px;
        font-size: 1.01rem;
        line-height: 1.72;
      }

      .markdown-content h2 {
        margin: 24px 0 10px;
        font-size: 1.18rem;
        font-weight: 600;
      }

      .markdown-content p {
        margin: 0 0 14px;
        color: var(--muted);
      }

      .markdown-content ul,
      .markdown-content ol {
        margin: 6px 0 15px;
        padding-left: 1.15em;
        color: var(--muted);
      }

      .markdown-content li {
        margin: 5px 0;
        line-height: 1.65;
      }

      .markdown-content hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 22px 0 14px;
      }

      .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0 18px;
        font-size: 0.92rem;
      }

      .markdown-content th,
      .markdown-content td {
        border: 1px solid var(--line);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }

      .markdown-content th {
        background: #f5f7fa;
        font-weight: 600;
      }

      .markdown-content tr:nth-child(even) {
        background: #fafbfc;
      }

      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .toc-link {
        display: block;
        padding: 4px 0 4px 10px;
        border-left: 2px solid transparent;
        color: var(--muted);
        line-height: 1.2;
        cursor: pointer;
      }

      .toc-link + .toc-link {
        margin-top: 4px;
      }

      .toc-link.active {
        border-left-color: var(--accent);
        color: var(--accent);
      }

      .backdrop {
        display: none;
      }

      @media (max-width: 1040px) {
        .mobile-bar {
          position: sticky;
          top: 0;
          z-index: 20;
          display: flex;
          align-items: center;
          gap: 12px;
          height: 52px;
          padding: 0 14px;
          border-bottom: 1px solid var(--line);
          background: rgba(255, 255, 255, 0.94);
          backdrop-filter: blur(12px);
        }

        .mobile-toggle {
          width: 34px;
          height: 34px;
          border: 0;
          border-radius: 8px;
          background: transparent;
          color: var(--muted);
          cursor: pointer;
        }

        .mobile-toggle svg {
          width: 18px;
          height: 18px;
        }

        .mobile-title strong {
          display: block;
          font-size: 0.95rem;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: fixed;
          top: 52px;
          left: 0;
          bottom: 0;
          width: min(84vw, 290px);
          z-index: 25;
          transform: translateX(-102%);
          transition: transform 0.22s ease;
        }

        body.nav-open .sidebar {
          transform: translateX(0);
        }

        .toc {
          display: none;
        }

        .main {
          padding: 24px 20px 40px;
        }

        .article {
          max-width: none;
        }

        .backdrop {
          position: fixed;
          inset: 52px 0 0;
          z-index: 15;
          display: block;
          opacity: 0;
          pointer-events: none;
          background: rgba(12, 19, 31, 0.22);
          transition: opacity 0.22s ease;
        }

        body.nav-open .backdrop {
          opacity: 1;
          pointer-events: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="mobile-bar">
      <button class="mobile-toggle" id="menuToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"></path>
        </svg>
      </button>
      <div class="mobile-title">
        <strong id="mobileContextTitle">Markdown folder</strong>
      </div>
    </header>

    <div class="backdrop" id="backdrop"></div>

    <div class="shell">
      <aside class="sidebar">
        <div class="brand" id="brandTitle"></div>
        <nav class="section-nav" id="sectionNav"></nav>
      </aside>

      <main class="main">
        <article class="article article-body hidden" id="articleBody">
          <div class="eyebrow" id="articleEyebrow"></div>
          <h1 id="articleTitle"></h1>
          <figure class="figure hidden" id="articleFigure">
            <img id="articleImage" alt="" />
          </figure>
          <ul class="commentary-list hidden" id="articleCommentary"></ul>
          <div class="markdown-content hidden" id="articleMarkdown"></div>
        </article>
      </main>

      <aside class="toc">
        <ul class="toc-list" id="itemNav"></ul>
      </aside>
    </div>

    <!-- Pack notes with: python3 embed_markdown_folder.py  (see STEPS.md) -->

counts for prepayments                                 |\n| **Basis Points**                                    | A unit of measure for interest rates; 1 basis point = 0.01% (100 basis points = 1%)                                                   |\n| **Bid Price**                                       | The price at which a buyer is willing to buy a security (opposite of ask price)                                                       |\n| **Bid-Ask Spread**                                  | The difference between what buyers will pay and what sellers will accept; indicates market liquidity                                  |\n| **Bond Rating**                                     | A credit quality assessment (AAA, AA, A, BBB, etc.) indicating the likelihood a bond issuer will repay debt                           |\n| **Book Value**                                      | The value of a mortgage pool recorded on a servicer's or investor's books                                                             |\n| **Bullet Bond**                                     | A bond where the entire principal is repaid in one lump sum at maturity, not gradually                                                |\n| **Call Option**                                     | The right (but not obligation) for an issuer to repay a bond before its maturity date                                                 |\n| **Callable Bond**                                   | A bond that can be redeemed by the issuer before the stated maturity date                                                             |\n| **Cash Flow**                                       | The movement of money in and out; for MBS, includes principal and interest payments                                                   |\n| **CMO**                                             | Collateralized Mortgage Obligation; a structured security that divides mortgage cash flows into different priority levels (tranches)  |\n| **Collateral**                                      | Assets pledged as security for a loan; in MBS, the underlying mortgages are the collateral                                            |\n| **Collateralized Debt Obligation (CDO)**            | A security backed by a pool of debt obligations, often including mortgage-backed securities                                           |\n| **Constant Prepayment Rate (CPR)**                  | An annualized estimate of how fast mortgages in a pool will be paid off early                                                         |\n| **Coupon**                                          | The periodic interest payment made to a bondholder; expressed as a percentage of face value                                           |\n| **Coupon Rate**                                     | The annual interest rate paid on a bond (e.g., 4% coupon means 4% annual interest)                                                    |\n| **Credit Risk**                                     | The risk that a borrower will default and fail to make required payments                                                              |\n| **Credit Spread**                                   | The difference in yield between a risky bond and a risk-free bond (like U.S. Treasuries)                                              |\n| **Custodian**                                       | A third party that holds and safeguards the mortgages or securities in a pool                                                         |\n| **Default**                                         | Failure to make required loan or bond payments on time                                                                                |\n| **Delinquency**                                     | A situation where a borrower is late on payments but has not yet defaulted                                                            |\n| **Discount**                                        | When a bond's market price is below its face value (occurs when rates have risen since issuance)                                      |\n| **Discount Bond**                                   | A bond trading below par value; typically occurs when its coupon is lower than current market rates                                   |\n| **Discount Rate**                                   | The interest rate used to calculate the present value of future cash flows                                                            |\n| **Dollar Roll**                                     | A short-term trading transaction where an investor sells an MBS and simultaneously agrees to repurchase a similar one at a later date |\n| **Duration**                                        | A measure of how sensitive a bond's price is to changes in interest rates; expressed in years                                         |\n| **Effective Duration**                              | A measure of duration that accounts for the impact of prepayments and callable features                                               |\n| **Extension Risk**                                  | The risk that falling interest rates will cause prepayments to slow, extending the bond's life longer than expected                   |\n| **Face Value**                                      | The principal amount of a bond that will be repaid at maturity (also called par value or par)                                         |\n| **Fannie Mae**                                      | Federal National Mortgage Association; a government-sponsored enterprise that buys, guarantees, and securitizes mortgages             |\n| **Fixed-Rate Mortgage**                             | A mortgage where the interest rate stays the same throughout the loan term                                                            |\n| **Floater**                                         | A bond with a variable coupon rate that adjusts periodically based on a reference rate                                                |\n| **Floater Cap**                                     | The maximum interest rate a floating-rate bond can pay                                                                                |\n| **Floater Floor**                                   | The minimum interest rate a floating-rate bond can pay                                                                                |\n| **Forward MBS**                                     | An MBS that will be delivered in the future, not immediately                                                                          |\n| **Freddie Mac**                                     | Federal Home Loan Mortgage Corporation; a government-sponsored enterprise that buys and securitizes mortgages                         |\n| **Freddie Mac PC**                                  | Participation Certificate issued by Freddie Mac; an agency MBS product                                                                |\n| **Ginnie Mae**                                      | Government National Mortgage Association; issues MBS backed by government-insured loans (FHA, VA, USDA)                               |\n| **Gross Coupon**                                    | The total interest rate on mortgages in a pool before the servicer takes their cut                                                    |\n| **GSE**                                             | Government-Sponsored Enterprise; includes Fannie Mae, Freddie Mac, and Ginnie Mae                                                     |\n| **Hedge**                                           | A transaction designed to reduce or offset the risk of another investment                                                             |\n| **Index**                                           | A benchmark rate (like SOFR or the 10-year Treasury yield) used to determine interest rates on adjustable products                    |\n| **Interest Rate Risk**                              | The risk that bond prices will fall if interest rates rise                                                                            |\n| **Interest-Only Strip (IO)**                        | A security that receives only the interest payments from a mortgage pool, not the principal                                           |\n| **Inverse Floater**                                 | A floating-rate bond where the coupon moves in the opposite direction of market rates                                                 |\n| **Liquidity**                                       | The ease with which a security can be bought or sold quickly without significantly affecting its price                                |\n| **Liquidity Risk**                                  | The risk that a security cannot be sold quickly without taking a significant loss                                                     |\n| **LTV**                                             | Loan-to-Value; the loan amount divided by the property's value, expressed as a percentage                                             |\n| **FICO Score**                                      | A credit score ranging from 300 to 850 that measures an individual's creditworthiness                                                 |\n| **Make-Whole Provision**                            | A clause allowing a borrower to pay off a loan early without penalty, usually by compensating the lender for lost interest            |\n| **Maturity Date**                                   | The date on which the principal of a bond must be repaid                                                                              |\n| **Moral Hazard**                                    | The risk that one party will take excessive risks knowing another party bears the cost of failure                                     |\n| **Mortgage Pool**                                   | A collection of mortgages bundled together                      |\n| **Prepayment Penalty**                              | A fee charged to a borrower for paying off a loan early                                                                               |\n| **Prepayment Risk**                                 | The risk that rising interest rates will slow prepayments, extending the bond's duration                                              |\n| **Premium Bond**                                    | A bond trading above par value; typically occurs when its coupon is higher than current market rates                                  |\n| **Principal**                                       | The original amount borrowed or the face value of a bond                                                                              |\n| **Principal-Only Strip (PO)**                       | A security that receives only the principal payments from a mortgage pool, not the interest                                           |\n| **Prospectus**                                      | A detailed document describing a security's terms, risks, and the issuer                                                              |\n| **PSA Model**                                       | A standard model that predicts mortgage prepayment speeds; 100% PSA is the baseline assumption                                        |\n| **Purchase Agreement**                              | A contract between the mortgage originator and the entity buying the mortgages for securitization                                     |\n| **Qualified Mortgage (QM)**                         | A mortgage meeting specific criteria established by regulations; offers certain legal protections                                     |\n| **Ramp-Up**                                         | The initial period of a CMO tranche where it doesn't receive principal payments yet                                                   |\n| **Real Estate Mortgage Investment Conduit (REMIC)** | A special legal structure used for securitizing mortgages with tax benefits                                                           |\n| **Refinancing**                                     | The process of replacing an existing loan with a new loan, typically to get better terms                                              |\n| **Reinvestment Risk**                               | The risk that interest and principal payments will have to be reinvested at lower rates                                               |\n| **Remainder Tranche**                               | The lowest priority tranche in a CMO that absorbs losses first                                                                        |\n| **Repurchase Agreement (Repo)**                     | A short-term transaction where securities are sold with an agreement to repurchase them at a set price                                |\n| **Residual Tranche**                                | The final CMO tranche that receives whatever cash remains after other tranches are paid                                               |\n| **Reverse Floater**                                 | Same as inverse floater; a bond with a coupon that moves opposite to interest rate changes                                            |\n| **Reverse Mortgage**                                | A mortgage allowing homeowners to borrow against their home equity, with repayment typically due upon death or sale                   |\n| **S&P 500**                                         | The Standard & Poor's 500 Index; a benchmark index of large-cap U.S. stocks                                                           |\n| **Secondary Market**                                | The market where existing securities are bought and sold between investors                                                            |\n| **Securitization**                                  | The process of pooling loans and creating tradable securities backed by those loans                                                   |\n| **Servicer**                                        | The company responsible for collecting mortgage payments, maintaining escrow accounts, and managing delinquencies                     |\n| **Servicing Fee**                                   | The fee charged by a servicer, typically 0.25% to 0.50% of the outstanding balance annually                                           |\n| **Settlement Date**                                 | The date when payment is delivered and ownership of a security transfers from seller to buyer                                         |\n| **Shelf Registration**                              | A process allowing an issuer to register securities that can be sold over time without additional registration                        |\n| **SOFR**                                            | Secured Overnight Financing Rate; a benchmark interest rate replacing LIBOR                                                           |\n| **Spread**                                          | The difference in yield between two securities; indicates relative value and risk                                                     |\n| **Stated Maturity**                                 | The date the final payment on a bond is due                                                                                           |\n| **Step-Up Bond**                                    | A bond where the coupon rate increases at predetermined intervals                                                                     |\n| **Stripped MBS**                                    | An MBS that has been divided into separate principal-only (PO) and interest-only (IO) securities                                      |\n| **Subordination**                                   | A structure where some securities have lower priority claims than others in receiving cash flows                                      |\n| **Support Tranche**                                 | In a CMO, a tranche that provides support to other tranches by absorbing prepayment risk                                              |\n| **Swap**                                            | A transaction where two parties exchange cash flows, often used to hedge interest rate risk                                           |\n| **TAC Bond**                                        | Targeted Amortization Class; a CMO tranche designed to have more stable prepayment characteristics                                    |\n| **Tail Risk**                                       | The risk of rare, extreme events that have a small probability but large impact                                                       |\n| **Tenor**                                           | The time remaining until a bond's maturity                                                                                            |\n| **Term Structure**                                  | The relationship between bond yields and their time to maturity; often shown as a yield curve                                         |\n| **Trade Date**                                      | The date when a securities transaction is agreed upon                                                                                 |\n| **Tranche**                                         | A portion or layer of a CMO or other structured security with its own priority, coupon, and maturity                                  |\n| **Treasury Bond**                                   | A long-term debt security issued by the U.S. government; considered risk-free                                                         |\n| **Underwriter**                                     | A firm that buys securities from an issuer and sells them to investors                                                                |\n| **Underwriting Standards**                          | The criteria used to determine whether a borrower qualifies for a mortgage                                                            |\n| **WAC**                                             | Weighted Average Coupon; the average interest rate on mortgages in a pool, weighted by balance                                        |\n| **WAM**                                             | Weighted Average Maturity; the average remaining time to maturity of mortgages in a pool, weighted by balance                         |\n| **Yield**                                           | The annual return on a bond investment, expressed as a percentage                                                                     |\n| **Yield Curve**                                     | A graph showing bond yields at different maturities; shape indicates economic expectations                                            |\n| **Yield Spread**                                    | The difference in yield between two bonds, often indicating relative risk                                                             |\n| **Z-Tranche**                                       | An accrual bond in a CMO that receives no cash payments until earlier tranches are retired; interest accrues                          |\n"

      const menuToggle = document.getElementById("menuToggle");
      const backdrop = document.getElementById("backdrop");

      const state = {
        title: "Markdown folder",
        data: null,
        section: null,
        item: null
      };

      function slug(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "") || "item";
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function displayName(value) {
        return String(value || "")
          .replace(/\.md$/i, "")
          .replace(/_/g, " ");
      }

      function inlineMarkdown(value) {
        return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      }

      function splitTableRow(line) {
        return String(line || "")
          .trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map((cell) => cell.trim());
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(line);
      }

      function markdownToHtml(text) {
        const lines = String(text || "").split(/\r?\n/);
        const html = [];
        const paragraph = [];
        let i = 0;
        let skippedTitle = false;

        function flushParagraph() {
          const value = paragraph.join(" ").trim();
          paragraph.length = 0;
          if (value) {
            html.push("<p>" + inlineMarkdown(value) + "</p>");
          }
        }

        while (i < lines.length) {
          const trimmed = lines[i].trim();
          if (!skippedTitle && /^#\s+/.test(trimmed)) {
            skippedTitle = true;
            i += 1;
            continue;
          }
          if (/^!\[[^\]]*\]\([^)]+\)/.test(trimmed)) {
            i += 1;
            continue;
          }
          if (!trimmed) {
            flushParagraph();
            i += 1;
            continue;
          }
          if (/^---+$/.test(trimmed)) {
            flushParagraph();
            html.push("<hr>");
            i += 1;
            continue;
          }
          if (/^##\s+/.test(trimmed)) {
            flushParagraph();
            html.push("<h2>" + inlineMarkdown(trimmed.replace(/^##\s+/, "")) + "</h2>");
            i += 1;
            continue;
          }
          if (trimmed.includes("|") && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
            flushParagraph();
            const header = splitTableRow(trimmed);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes("|") && !isTableSeparator(lines[i])) {
              if (lines[i].trim()) {
                rows.push(splitTableRow(lines[i]));
              }
              i += 1;
            }
            html.push(
              "<table><thead><tr>" +
                header.map((cell) => "<th>" + inlineMarkdown(cell) + "</th>").join("") +
                "</tr></thead><tbody>" +
                rows
                  .map(
                    (row) =>
                      "<tr>" +
                      row.map((cell) => "<td>" + inlineMarkdown(cell) + "</td>").join("") +
                      "</tr>"
                  )
                  .join("") +
                "</tbody></table>"
            );
            continue;
          }
          if (/^[-*+]\s+/.test(trimmed)) {
            flushParagraph();
            const items = [];
            while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
              items.push("<li>" + inlineMarkdown(lines[i].replace(/^\s*[-*+]\s+/, "").trim()) + "</li>");
              i += 1;
            }
            html.push("<ul>" + items.join("") + "</ul>");
            continue;
          }
          paragraph.push(trimmed);
          i += 1;
        }
        flushParagraph();
        return html.join("");
      }

      function parseMarkdown(text, fileName) {
        const titleMatch = text.match(/^#\s+(.+)$/m);
        const imageMatch = text.match(/!\[([^\]]*)\]\(([^)]+)\)/);
        const bullets = [];
        text.split(/\r?\n/).forEach((line) => {
          const match = line.match(/^\s*[-*+]\s+(.+)/);
          if (match) {
            bullets.push(match[1].trim());
          }
        });
        return {
          title: titleMatch ? titleMatch[1].trim() : fileName.replace(/\.md$/i, ""),
          imageAlt: imageMatch ? imageMatch[1].trim() : "",
          imageRel: imageMatch ? imageMatch[2].trim().replace(/^<|>$/g, "").split(/\s+/)[0] : "",
          bullets,
          hasTable: /^\s*\|.+\|\s*$/m.test(text),
          bodyHtml: markdownToHtml(text)
        };
      }

      function normalizePath(value) {
        return String(value || "")
          .replace(/\\/g, "/")
          .replace(/^\.\//, "")
          .replace(/\/+/g, "/");
      }

      function dirname(path) {
        const parts = normalizePath(path).split("/");
        parts.pop();
        return parts.join("/");
      }

      function joinPath(base, rel) {
        const cleaned = normalizePath(rel).replace(/^\//, "");
        if (!base) {
          return cleaned;
        }
        const stack = base.split("/").filter(Boolean);
        cleaned.split("/").forEach((part) => {
          if (part === "..") {
            stack.pop();
          } else if (part && part !== ".") {
            stack.push(part);
          }
        });
        return stack.join("/");
      }

      function folderFromPath(relPath, rootName) {
        const parts = normalizePath(relPath).split("/").filter(Boolean);
        if (parts.length >= 3) {
          return parts[parts.length - 2];
        }
        if (parts.length === 2) {
          return parts[0] === rootName ? rootName : parts[0];
        }
        return rootName || "files";
      }

      function renderBrandTitle() {
        const words = String(state.title || "Markdown folder").split(/\s+/).filter(Boolean);
        const first = words.slice(0, Math.max(1, words.length - 1)).join(" ") || "Markdown";
        const last = words.length > 1 ? words[words.length - 1] : "folder";
        brandTitle.innerHTML =
          '<div class="brand-title"><span class="brand-word">' +
          escapeHtml(first) +
          '</span><span class="brand-word accent">' +
          escapeHtml(last) +
          "</span></div>";
        mobileContextTitle.textContent = state.title;
      }

      function currentSection() {
        return state.data.sections.find((section) => section.key === state.section) || state.data.sections[0];
      }

      function currentItem() {
        return currentSection().items.find((item) => item.id === state.item) || currentSection().items[0];
      }

      function renderSectionNav() {
        sectionNav.innerHTML = state.data.sections
          .map((section) => {
            const active = section.key === state.section ? " active" : "";
            return (
              '<a class="section-link' +
              active +
              '" href="#' +
              section.key +
              '" data-section="' +
              section.key +
              '">' +
              escapeHtml(displayName(section.label)) +
              "</a>"
            );
          })
          .join("");

        sectionNav.querySelectorAll("[data-section]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            state.section = event.currentTarget.dataset.section;
            state.item = currentSection().items[0].id;
            render();
          });
        });
      }

      function renderItemNav() {
        const items = currentSection().items;
        itemNav.innerHTML = items
          .map((item) => {
            const active = item.id === state.item ? " active" : "";
            return (
              '<li><a class="toc-link' +
              active +
              '" href="#' +
              currentSection().key +
              "/" +
              item.id +
              '" data-item="' +
              item.id +
              '">' +
              escapeHtml(displayName(item.fileName)) +
              "</a></li>"
            );
          })
          .join("");

        itemNav.querySelectorAll("[data-item]").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            state.item = event.currentTarget.dataset.item;
            renderArticle();
            renderItemNav();
            syncHash();
            document.body.classList.remove("nav-open");
          });
        });
      }

      function renderArticle() {
        const item = currentItem();
        const section = currentSection();
        articleEyebrow.textContent = displayName(section.label);
        articleTitle.textContent = item.title;

        if (item.imageSrc) {
          articleFigure.classList.remove("hidden");
          articleImage.src = item.imageSrc;
          articleImage.alt = item.imageAlt || item.title;
        } else {
          articleFigure.classList.add("hidden");
          articleImage.removeAttribute("src");
          articleImage.alt = "";
        }

        if (item.hasTable && item.bodyHtml) {
          articleCommentary.classList.add("hidden");
          articleCommentary.innerHTML = "";
          articleMarkdown.classList.remove("hidden");
          articleMarkdown.innerHTML = item.bodyHtml;
        } else {
          articleMarkdown.classList.add("hidden");
          articleMarkdown.innerHTML = "";
          articleCommentary.classList.remove("hidden");
          articleCommentary.innerHTML = item.bullets.length
            ? item.bullets.map((bullet) => "<li>" + inlineMarkdown(bullet) + "</li>").join("")
            : "<li>No commentary found in this Markdown file.</li>";
        }
      }

      function syncHash() {
        window.location.hash = currentSection().key + "/" + state.item;
      }

      function hydrateFromHash() {
        const raw = window.location.hash.replace(/^#/, "");
        if (!raw || !state.data) {
          return;
        }
        const [sectionKey, itemId] = raw.split("/");
        const section = state.data.sections.find((entry) => entry.key === sectionKey);
        if (!section) {
          return;
        }
        state.section = section.key;
        if (itemId && section.items.some((item) => item.id === itemId)) {
          state.item = itemId;
        } else {
          state.item = section.items[0].id;
        }
      }

      function render() {
        articleBody.classList.remove("hidden");
        renderBrandTitle();
        renderSectionNav();
        renderItemNav();
        renderArticle();
        syncHash();
        document.body.classList.remove("nav-open");
      }

      function lookupAsset(path, assets) {
        const exact = normalizePath(path);
        if (assets[exact]) {
          return assets[exact];
        }
        const lower = exact.toLowerCase();
        const match = Object.keys(assets).find((key) => key.toLowerCase() === lower);
        if (match) {
          return assets[match];
        }
        const base = exact.split("/").pop();
        const byBase = Object.keys(assets).filter((key) => key.split("/").pop().toLowerCase() === base.toLowerCase());
        return byBase.length === 1 ? assets[byBase[0]] : "";
      }

      function buildLibrary(markdownFiles, assets, rootName) {
        const grouped = new Map();
        markdownFiles.forEach((entry) => {
          const folder = folderFromPath(entry.path, rootName);
          if (!grouped.has(folder)) {
            grouped.set(folder, []);
          }
          const parsed = parseMarkdown(entry.text, entry.fileName);
          const imagePath = parsed.imageRel
            ? joinPath(dirname(entry.path), parsed.imageRel)
            : "";
          grouped.get(folder).push({
            id: slug(entry.fileName.replace(/\.md$/i, "")),
            fileName: entry.fileName,
            title: parsed.title,
            imageAlt: parsed.imageAlt,
            imageSrc: imagePath ? lookupAsset(imagePath, assets) : "",
            bullets: parsed.bullets,
            hasTable: parsed.hasTable,
            bodyHtml: parsed.bodyHtml
          });
        });

        const sections = Array.from(grouped.entries())
          .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))
          .map(([label, items]) => ({
            key: slug(label),
            label,
            items
          }));

        if (!sections.length) {
          throw new Error("No Markdown files found in that folder.");
        }

        state.title = rootName.replace(/[_-]+/g, " ") || "Markdown folder";
        state.data = { sections };
        state.section = sections[0].key;
        state.item = sections[0].items[0].id;
        hydrateFromHash();
        render();
      }

      function loadFromEntries(entries, rootName) {
        const assets = {};
        const markdownFiles = [];
        (entries || []).forEach((entry) => {
          const path = normalizePath(entry.path);
          if (!path) {
            return;
          }
          if (typeof entry.text === "string" && MD_EXT.test(path)) {
            markdownFiles.push({
              path,
              fileName: path.split("/").pop(),
              text: entry.text
            });
          } else if ((entry.dataUrl || entry.url) && IMAGE_EXT.test(path)) {
            assets[path] = entry.dataUrl || entry.url;
          }
        });
        if (!markdownFiles.length) {
          return false;
        }
        markdownFiles.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
        buildLibrary(markdownFiles, assets, rootName || "Markdown folder");
        return true;
      }

      function joinUrl(base, rel) {
        const cleaned = String(rel || "").replace(/^\.\//, "").replace(/^\/+/, "");
        if (!base) {
          return cleaned;
        }
        return String(base).replace(/\/?$/, "/") + cleaned;
      }

      async function fetchJson(url) {
        try {
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) {
            return null;
          }
          return await response.json();
        } catch (error) {
          return null;
        }
      }

      async function listDirectory(url) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          return { dirs: [], files: [] };
        }
        const text = await response.text();
        if (!text || text.trim().startsWith("{") || text.trim().startsWith("[")) {
          return { dirs: [], files: [] };
        }
        const dirs = [];
        const files = [];
        const skip = new Set(["", ".", "..", "./", "../"]);
        const hrefs = text.matchAll(/href=["']([^"'?#]+)["']/gi);
        for (const match of hrefs) {
          let href = match[1];
          try {
            href = decodeURIComponent(href);
          } catch (error) {
            continue;
          }
          href = href.replace(/^\.\//, "");
          if (skip.has(href) || href.startsWith("../") || href.startsWith("/") || href.includes("://") || href.startsWith(".")) {
            continue;
          }
          if (href.endsWith("/")) {
            dirs.push(href.replace(/\/+$/, ""));
          } else {
            files.push(href.split("/").pop());
          }
        }
        return {
          dirs: Array.from(new Set(dirs)).filter(Boolean),
          files: Array.from(new Set(files)).filter(Boolean)
        };
      }

      async function collectLiveEntries(base, prefix, depth) {
        const listing = await listDirectory(base);
        const entries = [];
        for (const file of listing.files) {
          const rel = prefix ? prefix + "/" + file : file;
          const url = joinUrl(base, file);
          if (MD_EXT.test(file)) {
            const response = await fetch(url, { cache: "no-store" });
            if (response.ok) {
              entries.push({ path: rel, text: await response.text() });
            }
          } else if (IMAGE_EXT.test(file)) {
            entries.push({ path: rel, url });
          }
        }
        if (depth > 0) {
          for (const dir of listing.dirs) {
            if (dir.startsWith(".") || dir === "node_modules") {
              continue;
            }
            const nested = await collectLiveEntries(
              joinUrl(base, dir + "/"),
              prefix ? prefix + "/" + dir : dir,
              depth - 1
            );
            entries.push(...nested);
          }
        }
        return entries;
      }

      async function loadManifest(manifest, fileBase) {
        const library = manifest.library || "";
        const entries = [];
        for (const rel of manifest.files || []) {
          const path = normalizePath(rel);
          const url = joinUrl(fileBase, library ? library + "/" + path : path);
          if (MD_EXT.test(path)) {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              continue;
            }
            entries.push({ path, text: await response.text() });
          } else if (IMAGE_EXT.test(path)) {
            entries.push({ path, url });
          }
        }
        return loadFromEntries(entries, manifest.root || library || "Markdown folder");
      }

      async function tryLoadLive() {
        const preferred = ["md_uploaded", "markdown", "notes", "md"];
        const localManifest = await fetchJson("manifest.json");
        if (localManifest && (await loadManifest(localManifest, "./"))) {
          return true;
        }

        for (const name of preferred) {
          const nested = await fetchJson(name + "/manifest.json");
          if (!nested) {
            continue;
          }
          const base = nested.library ? "./" : name + "/";
          if (await loadManifest(nested, base)) {
            return true;
          }
        }

        const top = await listDirectory("./");
        const candidates = preferred.filter((name) => top.dirs.includes(name)).concat(
          top.dirs.filter((name) => preferred.indexOf(name) === -1)
        );
        const scored = [];
        for (const dir of candidates) {
          const entries = await collectLiveEntries(joinUrl("./", dir + "/"), "", 3);
          const mdCount = entries.filter((entry) => entry.text).length;
          if (mdCount) {
            scored.push({ dir, entries, mdCount });
          }
        }
        if (scored.length) {
          scored.sort((a, b) => {
            const prefA = preferred.indexOf(a.dir);
            const prefB = preferred.indexOf(b.dir);
            if (prefA !== -1 || prefB !== -1) {
              return (prefA === -1 ? 99 : prefA) - (prefB === -1 ? 99 : prefB);
            }
            return b.mdCount - a.mdCount;
          });
          const best = scored[0];
          return loadFromEntries(best.entries, best.dir);
        }

        const here = await collectLiveEntries("./", "", 2);
        return loadFromEntries(here, "Markdown folder");
      }

      function tryLoadEmbedded() {
        const node = document.getElementById("embeddedFolder");
        if (!node) {
          return false;
        }
        try {
          const payload = JSON.parse(node.textContent);
          return loadFromEntries(payload.files, payload.root);
        } catch (error) {
          return false;
        }
      }

      async function boot() {
        renderBrandTitle();
        if (window.location.protocol !== "file:") {
          try {
            if (await tryLoadLive()) {
              return;
            }
          } catch (error) {
            // Fall back to the packed notes.
          }
        }
        tryLoadEmbedded();
      }

      if (menuToggle) {
        menuToggle.addEventListener("click", () => {
          document.body.classList.toggle("nav-open");
        });
      }

      backdrop.addEventListener("click", () => {
        document.body.classList.remove("nav-open");
      });

      window.addEventListener("hashchange", () => {
        if (!state.data) {
          return;
        }
        hydrateFromHash();
        render();
      });

      boot();
    </script>
  </body>
</html>
