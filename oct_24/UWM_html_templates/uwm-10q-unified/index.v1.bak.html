meric:tabular-nums}.fname{flex:1 1 auto;font-weight:700;font-size:calc(var(--b)*0.72);line-height:1.3;min-width:0;overflow-wrap:anywhere}.fval{flex:0 1 auto;margin-left:auto;font-weight:700;font-size:calc(var(--b)*0.78);font-variant-numeric:tabular-nums;color:#7A1F2B;text-align:right!important;white-space:nowrap}.fu{font-size:calc(var(--b)*0.5);color:#54403f;font-weight:700}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.fp{border-radius:8px;padding:10px 14px;font-size:calc(var(--b)*0.62*0.88);line-height:1.45;color:#241416;min-width:0;text-align:left}.ft{background:linear-gradient(160deg,#F7EEF0,#EAD6D8)}.fe{background:linear-gradient(160deg,#FBF7EE,#F1E7D3)}.fl{font-size:calc(var(--b)*0.44);letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#7a1f2b;margin-bottom:4px}.fe .fl{color:#7a5a2b}.fl.fls{text-transform:none!important;letter-spacing:.04em;font-size:calc(var(--b)*0.52)}.fl.fls em{font-style:italic}@media(max-width:700px){.fgrid{grid-template-columns:1fr}.fhead{flex-wrap:wrap}.fval{white-space:normal}}table th,table td{text-align:left!important}.fp,.fp *{text-align:left!important}.lede::first-letter,.lede:first-letter{float:none!important;font-size:inherit!important;line-height:inherit!important;margin:0!important;padding:0!important;font-weight:inherit!important;color:inherit!important;background:none!important;-webkit-text-fill-color:currentColor!important;font-family:inherit!important;font-style:inherit!important;initial-letter:normal!important}.fl em{font-style:italic}.shsrc{font-size:15px;color:#54403f;margin:4px 0 12px}.sheet{margin:6px 0 24px}table.xl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #cfb0b4;background:#fff;font-size:17.5px;table-layout:auto}table.xl th,table.xl td{border-right:1px solid #e2cfd1;border-bottom:1px solid #e2cfd1;padding:10px 12px;text-align:left!important;vertical-align:middle}table.xl thead th{position:sticky;top:0;z-index:2;background:#D4BFC1!important;color:#241416;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;border-bottom:1.5px solid #b0646f}table.xl tbody tr:nth-child(even) td{background:#fbf5f5}table.xl tbody tr:nth-child(odd) td{background:#fff}td.xn,th.xn{width:44px;padding:8px 6px!important}td.xn .fnum{display:flex;justify-content:center}.fnum span{width:28px;height:28px;box-sizing:border-box;border:1.5px solid #7A1F2B;border-radius:50%;background:transparent;color:#7A1F2B;font-weight:700;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}td.xf{font-variant-numeric:normal;font-feature-settings:normal;font-weight:700;color:#3a1218;min-width:180px}td.xt{font-variant-numeric:normal;font-feature-settings:normal;font-size:.85em;color:#6b5558;line-height:1.4;min-width:220px}table.xl td.xv{background:#F0DFE1!important;border-left:3px solid #7A1F2B;font-weight:700;font-size:1.15em;font-variant-numeric:tabular-nums;color:#3a1218;white-space:nowrap}table.xl th.xv{border-left:3px solid #7A1F2B}.xu{font-size:.6em;color:#54403f;font-weight:700}@media(max-width:900px){.sheet{overflow-x:auto}table.xl{min-width:640px}}.index a,.index a .tx,.index a .nm{font-size:17.5px!important;white-space:normal!important}.index .ixh{font-size:15.4px!important}table.xl td.xt{color:rgba(58,18,24,.9)!important}table.xl tbody tr.t-total td{background:#F3E3E5!important}table.xl tbody tr.t-total td.xn{box-shadow:inset 2px 0 0 #7A1F2B}table.xl tbody tr.t-total td.xf{font-weight:800}table.xl tbody tr.t-sub td{background:#FAF2F3!important}table.xl tbody tr.t-sub td.xn{box-shadow:inset 1px 0 0 #CFA9AF}table.xl tbody tr.t-sub td.xf{padding-left:26px}table.xl tbody tr.t-total td.xv{background:#EBCFD3!important}table.xl tbody tr.t-sub td.xv{background:#F3E4E6!important}</style><style>.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:10px 14px;border:1px solid #cfb0b4;border-left:4px solid #7a1f2b;border-radius:8px;background:#F7EEF0}.qbar label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#7a1f2b}.qbar select{font:inherit;font-size:17px;font-weight:700;color:#3a1218;padding:6px 10px;border:1.5px solid #7a1f2b;border-radius:6px;background:#fff;cursor:pointer}.qbar .qp{font-size:15px;color:#54403f}table.xl tbody tr.t-miss td{color:#9b8a8c!important;background:#f6f3f3!important}table.xl tbody tr.t-miss td.xv{background:#efeaea!important;border-left-color:#c9b9bb;color:#9b8a8c!important;font-weight:400}tr.t-miss .fnum span{border-color:#c9b9bb;color:#9b8a8c}.xnote{display:block;font-size:.58em;font-weight:700;color:#7a1f2b;letter-spacing:.04em;margin-top:3px;white-space:normal}.xmiss{font-size:.6em;font-style:italic;margin-left:6px}.qsw{font:15px/1 sans-serif;padding:6px 9px;border:1.5px solid #7a1f2b;border-radius:6px;background:#fff;color:#7a1f2b;cursor:pointer}.qsw:hover{background:#F0DFE1}table.xl th.xv+th.xv,table.xl td.xv+td.xv{border-left:1.5px solid #b0646f}table.xl td.xv.vmiss{background:#efeaea!important;color:#9b8a8c!important;font-weight:400;border-left-color:#c9b9bb}@media(max-width:700px){.qbar{gap:8px}.qbar select{font-size:15px}}.xpick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}table.xl th select.qs{font:inherit;font-size:13px;letter-spacing:.06em;font-weight:700;color:#3a1218;text-transform:none;padding:4px 6px;border:1.5px solid #7a1f2b;border-radius:5px;background:#fff;cursor:pointer;max-width:100%}table.xl th select.qs.add{border-style:dashed;color:#7a1f2b;background:transparent;font-size:12px;padding:3px 4px}table.xl th.xadd{width:1%;white-space:nowrap;padding:6px!important;background:#E6D4D6!important}table.xl td.xgap{background:transparent!important;width:1%;padding:0!important;border-right:none}table.xl th .qsw{font-size:12px;padding:3px 6px}table.xl.xsm td.xt{font-size:.51em!important}.qerr{padding:20px;color:#7a1f2b;font-weight:700}</style></head><body>
<main class="wrap">

<div class="layout">
<nav class="index" id="series" aria-label="Contents"></nav>
<div class="main">
<div id="page"><p class="qerr">Loading…</p></div>
<div class="pager"><button id="prev">← Prev</button><span id="ind"></span><button id="next">Next →</button></div>

</div></div>
</main>
<script>
const DATA_DIR='uwm_10q_data/';
const GROUPS=["Results & Production","Assets, Cash & Funding","Shareholders, Adjustments & Risk"];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let Q=[],D={},P=[],i=-1,cur=null,A=null,B=null;const cols=()=>[A,B].filter(Boolean);
const series=document.getElementById('series'),OPTS='';
// Format a value: raw numbers become $X.XXM / $X.XXB unless unit says percent/bps/count; strings pass through unchanged.
function fmt(v,u){if(v==null||v==='')return null;if(typeof v!=='number')return esc(v);u=(u||'').toLowerCase();
 if(/percent|%/.test(u))return v.toFixed(2)+'%';if(/bps|basis/.test(u))return v+' bps';if(/count|ratio|score|month|share$/.test(u))return v.toLocaleString('en-US');
 const a=Math.abs(v),s=v<0?'−':'';return a>=1e9?s+'$'+(a/1e9).toFixed(2)+'B':a>=1e6?s+'$'+(a/1e6).toFixed(2)+'M':s+'$'+a.toLocaleString('en-US',{maximumFractionDigits:2})}
const key=r=>r.field_key||r.field_name;
// Build the union of sections and fields across every loaded quarter (no hard-coded list).
function buildUnion(){const secs={};
 Q.forEach(q=>{const d=D[q.id];if(!d)return;let prev=null,ps=null;d.fields.forEach(r=>{const sn=r.section_number;if(sn!==ps){prev=null;ps=sn}
  const s=secs[sn]||(secs[sn]={n:String(sn),t:r.section,g:r.group||0,order:[],meta:{}});const k=key(r);
  if(!(k in s.meta)){s.order.splice(prev===null?0:s.order.indexOf(prev)+1,0,k);s.meta[k]=r}prev=k})});
 return Object.values(secs).sort((a,b)=>a.n-b.n)}
function rowsFor(p,id){const m={};(D[id]?D[id].fields:[]).forEach(r=>{if(r.section_number==p.n)m[key(r)]=r});return m}
function cell(r,L,miss){if(!r)return `<td class="xv vmiss">—<span class="xmiss">not in ${esc(L)}</span></td>`;const v=fmt(r.value,r.unit);
 const tags=[r.source&&r.source!=='10-Q'?r.source:'',r.note||''].filter(Boolean);
 return `<td class="xv${v==null?' vmiss':''}">${v==null?'—<span class="xmiss">not reported</span>':v}${r.unit&&v!=null?` <span class="xu">${esc(r.unit)}</span>`:''}${tags.length?`<span class="xnote">${esc(tags.join(' · '))}</span>`:''}</td>`}
function nav(){series.innerHTML='';const h=document.createElement('a');h.className='home';h.innerHTML='<span class="tx">🏠 UWM 10-Q</span>';h.href='#'+hs(-1);series.appendChild(h);
 P.forEach((p,k)=>{if(k==0||P[k-1].g!==p.g){const d=document.createElement('div');d.className='ixh g'+p.g;d.textContent=GROUPS[p.g];series.appendChild(d)}
  const a=document.createElement('a');a.innerHTML=`<span class="nm">${p.n} <span class="arw">→</span></span><span class="tx">${esc(p.t)}</span>`;a.href='#'+hs(k);series.appendChild(a)});addTog()}
function pick(w,v){return `<select class="qs${v?'':' add'}" data-w="${w}" aria-label="Quarter ${w.toUpperCase()}">${v?'':'<option value="none" selected>+ compare</option>'}${Q.map(q=>`<option value="${q.id}"${q.id===v?' selected':''}>${esc(q.label)}</option>`).join('')}${v?'<option value="none">— none —</option>':''}</select>`}
const SW='<button class="qsw" data-swap="1" title="Swap A and B">⇄</button>';
function hdr(){const a=A?`<th class="xv"><span class="xpick">${pick('a',A)}${B?SW:''}<span>value</span></span></th>`:'',b=B?`<th class="xv"><span class="xpick">${pick('b',B)}<span>value</span></span></th>`:'';
 if(A&&B)return a+b;return A?a+`<th class="xadd">${pick('b',null)}</th>`:`<th class="xadd">${pick('a',null)}</th>`+b}
function render(p){const C=cols(),M=C.map(id=>rowsFor(p,id)),Ls=C.map(id=>D[id].quarter);let n=0;
 const stat=C.map((id,j)=>{const h=p.order.filter(k=>M[j][k]).length;return `${h} fields in ${esc(Ls[j])}`}).join(' · ');
 const notes=[...new Set(C.flatMap((id,j)=>Object.values(M[j]).filter(r=>r.note).map(r=>r.note)))];
 return `<div class="term">${esc(p.t)}</div><article><div class="sheet"><table class="xl${p.t==='Gain on Sale & Margins'?' xsm':''}"><thead><tr><th class="xn">#</th><th>Field</th><th>Technical definition</th>${hdr()}</tr></thead><tbody>${p.order.map(k=>{n++;const rs=M.map(m=>m[k]),x=rs.find(Boolean)||p.meta[k],all=rs.every(r=>!r);
  return `<tr class="t-${all?'miss':(x.tier||'plain')}"><td class="xn"><span class="fnum"><span>${n}</span></span></td><td class="xf">${esc(x.field_name)}</td><td class="xt">${esc(x.technical_definition)}</td>${!A?'<td class="xgap"></td>':''}${rs.map((r,j)=>cell(r,Ls[j])).join('')}${A&&!B?'<td class="xgap"></td>':''}</tr>`}).join('')}</tbody></table></div></article>`}
function home(){const d=D[cur],tot=d.fields.length;const secs=GROUPS.map((h,g)=>{const ks=P.map((p,k)=>k).filter(k=>P[k].g===g);return ks.length?`<div class="tocg"><div class="toch g${g}">${g+1}. ${h}</div><ol class="toc">${ks.map(k=>`<li><a href="#${hs(k)}"><span class="nm">${P[k].n} <span class="arw">→</span></span><span class="tx">${esc(P[k].t)}</span></a></li>`).join('')}</ol></div>`:''});
 return `<section class="homep"><div class="term">UWM ${cols().map(id=>esc(D[id].quarter)).join(' vs ')} 10-Q — Unified Spreadsheet</div><p class="hsub">${cols().map(id=>D[id].fields.length).join(' / ')} fields, ${P.length} sections</p>${secs.join('')}</section>`}
function hs(k){return 'a='+(A||'none')+'&b='+(B||'none')+'&p='+(k<0?'home':P[k].n)}
function parse(){const o={};location.hash.slice(1).split('&').forEach(s=>{const [a,b]=s.split('=');if(b!==undefined)o[a]=decodeURIComponent(b)});return o}
function go(k){i=Math.max(-1,Math.min(P.length-1,k));const pg=document.getElementById('page');
 pg.innerHTML=i<0?home():render(P[i]);document.body.classList.toggle('on-home',i<0);
 document.getElementById('ind').textContent=i<0?'Home':`${P[i].n} · ${i+1} / ${P.length}`;prev.disabled=i<0;next.disabled=i==P.length-1;
 [...series.querySelectorAll('a')].forEach((a,j)=>a.classList.toggle('on',j-1==i));
 document.title=(i<0?'UWM '+cols().map(id=>D[id].quarter).join(' vs ')+' 10-Q':P[i].t)+' · UWM 10-Q — Unified Spreadsheet';
 const h='#'+hs(i);if(location.hash!==h)history.replaceState(null,'',h)}
async function load(id){if(!D[id]){const q=Q.find(x=>x.id===id);const r=await fetch(DATA_DIR+q.file.split('/').pop(),{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);D[id]=await r.json()}}
async function apply(){const o=parse(),ok=x=>Q.some(q=>q.id===x);
 let a=o.a!==undefined?o.a:(o.q||Q[0].id),b=o.b!==undefined?o.b:'none';a=ok(a)?a:null;b=ok(b)?b:null;if(!a&&!b)a=Q[0].id;
 A=a;B=b;cur=A||B;
 if(!series.children.length)nav();else [...series.querySelectorAll('a')].forEach((el,j)=>el.href='#'+hs(j-1));
 const k=P.findIndex(p=>p.n===o.p);go(k)}
function setAB(a,b){location.hash='a='+a+'&b='+b+'&p='+(i<0?'home':P[i].n)}
document.addEventListener('change',e=>{const t=e.target;if(t.matches&&t.matches('select.qs')){t.dataset.w==='a'?setAB(t.value,B||'none'):setAB(A||'none',t.value)}});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-swap]'))setAB(B||'none',A||'none')});
prev.onclick=()=>{go(i-1);scrollTo(0,0)};next.onclick=()=>{go(i+1);scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key=='ArrowRight'){go(i+1);scrollTo(0,0)}if(e.key=='ArrowLeft'){go(i-1);scrollTo(0,0)}});
addEventListener('hashchange',()=>{apply();scrollTo(0,0)});
function addTog(){var h=document.querySelector('.index a.home');if(!h||h.querySelector('.ixtog'))return;var b=document.createElement('button');b.className='ixtog';b.title='Hide or show index';b.textContent=document.body.classList.contains('ixoff')?'›':'‹';b.onclick=function(e){e.preventDefault();e.stopPropagation();var off=document.body.classList.toggle('ixoff');b.textContent=off?'›':'‹';try{localStorage.ixoff=off?1:''}catch(_){}};h.appendChild(b)}
try{if(localStorage.ixoff)document.body.classList.add('ixoff')}catch(_){}
(async()=>{try{const m=await (await fetch(DATA_DIR+'manifest.json',{cache:'no-cache'})).json();Q=m.quarters;
 const opts=Q.map(q=>`<option value="${q.id}">${esc(q.label)}</option>`).join('')+'<option value="none">— none —</option>';
 await Promise.all(Q.map(q=>load(q.id)));P=buildUnion();await apply()}catch(e){document.getElementById('page').innerHTML='<p class="qerr">Could not load quarter data ('+esc(e.message)+'). Open this page over http(s).</p>'}})();
</script></body></html>
